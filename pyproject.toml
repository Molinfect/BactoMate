[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bactimate"
version = "1.6"
description = "Batch processing and analysis GUI for microscopy (Omnipose, tracking)"
readme = "docs/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BactiMate" }]
keywords = ["microscopy", "omnipose", "segmentation", "tracking", "nd2", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Optional extras: pip install -e .[cuda] for CUDA PyTorch.
# Base install: pip install -r requirements.txt (or pip install -e .)
[project.optional-dependencies]
cuda = [
    "torch",
    "torchvision",
]
# Install CUDA-built PyTorch manually, e.g.:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu118
# Base workflow: install from repo with pip install -r requirements.txt

[project.scripts]
bactimate = "bactimate.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bactimate*"]
exclude = ["tests*", "Logs*"]
