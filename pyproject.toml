[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bactomate"
version = "2.8.3"
description = "Integrated microscopy analysis platform: conversion, segmentation, tracking, training, and reporting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BactoMate" }]
keywords = ["microscopy", "omnipose", "segmentation", "tracking", "nd2", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Optional extras: pip install -e .[cuda] for CUDA PyTorch.
# Base install: pip install -r requirements.txt (or pip install -e .)
[project.optional-dependencies]
cuda = [
    "torch",
    "torchvision",
]
dev = [
    "pytest",
    "pytest-cov",
]
# Install CUDA-built PyTorch manually, e.g.:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu118
# Base workflow: install from repo with pip install -r requirements.txt

[project.scripts]
bactomate = "bactomate.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: integration tests that exercise multi-step pipelines",
]

[tool.coverage.run]
source = ["bactomate"]
omit = ["tests/*"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.setuptools.packages.find]
where = ["."]
include = ["bactomate*"]
exclude = ["tests*", "Logs*"]
