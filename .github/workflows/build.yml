name: Build BactiMate (macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [created]

jobs:
  build-macos:
    name: Build macOS Application
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create virtual environment
        run: |
          python3 -m venv --copies venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test (before build)
        run: |
          source venv/bin/activate
          python main.py --version
          python main.py --smoke-test

      - name: Create icons
        run: |
          chmod +x build/create_icons.sh
          ./build/create_icons.sh || echo "Icons already exist or creation failed"

      - name: Build macOS application bundle
        run: |
          chmod +x build/build_app_bundle.sh
          ./build/build_app_bundle.sh

      - name: Create DMG
        run: |
          chmod +x build/create_dmg.sh
          ./build/create_dmg.sh

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: BactiMate-macOS
          path: dist/BactiMate.dmg
          retention-days: 30

      - name: Upload macOS DMG (release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/BactiMate.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
