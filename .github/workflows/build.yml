name: BactoMate CI (source install)

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - 'img/**'
      - 'LICENSE'
      - 'Logs/**'
      - 'README.md'
      - '**/README.md'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - 'img/**'
      - 'LICENSE'
      - 'Logs/**'
      - 'README.md'
      - '**/README.md'

jobs:
  smoke-macos:
    name: macOS source install + smoke test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run macOS installer
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash setup/macos/setup_fresh_env.sh

      - name: Full pytest (headless Qt)
        run: |
          source venv/bin/activate
          pip install pytest
          export QT_QPA_PLATFORM=offscreen
          pytest tests/ -q --tb=short

  smoke-windows:
    name: Windows source install + smoke test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Windows installer from a browser-renamed path
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $target = Join-Path $env:RUNNER_TEMP "BactoMate (1)!"
          Copy-Item -LiteralPath $env:GITHUB_WORKSPACE -Destination $target -Recurse
          & "$target\setup\windows\install.bat"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Get-Content -LiteralPath "$target\Logs\install_last.log" -Raw
          if ($log -notmatch 'Smoke test OK' -or $log -notmatch 'Install complete') { throw 'Install transcript incomplete' }
          "INSTALL_TEST_ROOT=$target" >> $env:GITHUB_ENV

      - name: Full pytest (headless Qt)
        shell: cmd
        run: |
          cd /d "%INSTALL_TEST_ROOT%"
          venv\Scripts\python.exe -m pip install pytest
          set QT_QPA_PLATFORM=offscreen
          venv\Scripts\python.exe -m pytest tests/ -q --tb=short
