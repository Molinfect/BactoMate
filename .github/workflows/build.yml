name: BactoMate CI (source install)

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    tags:
      - 'v*'
  pull_request:
    branches: [main, dev]

jobs:
  smoke-macos:
    name: macOS source install + smoke test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          python setup/apply_all_patches.py || true

      - name: Smoke test
        run: |
          source venv/bin/activate
          python main.py --version
          python main.py --smoke-test

      - name: Full pytest (headless Qt)
        run: |
          source venv/bin/activate
          pip install pytest
          export QT_QPA_PLATFORM=offscreen
          pytest tests/ -q --tb=short

  smoke-windows:
    name: Windows source install + smoke test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: cmd
        run: |
          python setup\windows\verify_python.py
          python -m venv venv
          venv\Scripts\python.exe -m pip install "pip>=24.2,<26"
          venv\Scripts\python.exe -m pip install "dbscan==0.0.10" --only-binary dbscan
          venv\Scripts\python.exe -m pip install --use-deprecated=legacy-resolver -r requirements.txt -c setup\windows\constraints.txt
          venv\Scripts\python.exe -m pip install -e .
          venv\Scripts\python.exe setup\apply_all_patches.py

      - name: Smoke test
        shell: cmd
        run: |
          venv\Scripts\python.exe main.py --version
          venv\Scripts\python.exe main.py --smoke-test

      - name: Full pytest (headless Qt)
        shell: cmd
        run: |
          venv\Scripts\python.exe -m pip install pytest
          set QT_QPA_PLATFORM=offscreen
          venv\Scripts\python.exe -m pytest tests/ -q --tb=short
