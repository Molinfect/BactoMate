name: Windows installer Step 1 tests

# Fast check of setup/windows/install.bat Python discovery under real cmd.exe
# (mocked py/winget). The full source install runs in build.yml.
on:
  workflow_dispatch:
  push:
    paths:
      - 'setup/windows/install.bat'
      - 'setup/windows/verify_python.py'
      - 'tests/test_windows_install_python_step.py'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'setup/windows/install.bat'
      - 'setup/windows/verify_python.py'
      - 'tests/test_windows_install_python_step.py'
      - '.github/workflows/windows-installer.yml'

jobs:
  install-step1:
    name: install.bat Step 1 (cmd harness)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run harness
        shell: cmd
        run: |
          python -m pip install pytest
          python -m pytest tests/test_windows_install_python_step.py -v -rs --tb=short
