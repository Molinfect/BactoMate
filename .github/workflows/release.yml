name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# GitHub rejects any single release asset >= 2 GiB (2147483648 bytes).
# Upload assets directly to the GitHub Release (not Actions artifacts) so
# large DMG/ZIP builds do not exhaust Actions artifact storage quota.
env:
  GITHUB_ASSET_MAX_BYTES: 2147000000

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          append_body: true
          body: |
            ## Install

            | Platform | Download | Steps |
            |----------|----------|-------|
            | **macOS** | `BactoMate.dmg` | Open DMG → drag to Applications |
            | **Windows** | `BactoMate-win64.zip` | Extract under your user folder → run `BactoMate.bat` |

            Use these assets for lab installs. GitHub also attaches **Source code (zip)**; that archive is the repository source for developers. See `INSTALL.txt` in the extracted folder. Lab Macs and PCs should use the DMG or Windows zip above.

            If **BactoMate.dmg** is missing, the macOS build did not upload to this release. Wait for a fixed release or contact maintainers. The source zip is for developer builds from the repository.

            **Developers:** [README](https://github.com/Molinfect/BactoMate/blob/main/README.md), [`setup/`](https://github.com/Molinfect/BactoMate/tree/main/setup). On a Mac, local DMG: `./build/macos/build_app_bundle.sh` then `./build/macos/create_dmg.sh`.

  build-macos:
    name: Build macOS DMG
    needs: [prepare-release]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          python setup/apply_all_patches.py || true

      - name: Build app bundle and DMG
        run: |
          chmod +x setup/macos/*.sh build/macos/*.sh
          ./build/macos/build_app_bundle.sh
          ./build/macos/create_dmg.sh
          ls -lh dist/BactoMate.dmg

      - name: Upload DMG to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG="dist/BactoMate.dmg"
          test -f "$DMG"
          SIZE=$(stat -f%z "$DMG")
          echo "macOS DMG: $SIZE bytes"
          if [ "$SIZE" -ge "${GITHUB_ASSET_MAX_BYTES}" ]; then
            echo "::error::macOS DMG exceeds GitHub's 2 GiB asset limit."
            exit 1
          fi
          gh release upload "${{ github.ref_name }}" "$DMG" --clobber

  build-windows:
    name: Build Windows zip
    needs: [prepare-release]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: cmd
        run: |
          python setup\windows\verify_python.py
          python -m venv venv
          venv\Scripts\python.exe -m pip install "pip>=24.2,<26"
          venv\Scripts\python.exe -m pip install "dbscan==0.0.10" --only-binary dbscan
          venv\Scripts\python.exe -m pip install --use-deprecated=legacy-resolver -r requirements.txt -c setup\windows\constraints.txt
          venv\Scripts\python.exe -m pip install -e .
          venv\Scripts\python.exe setup\apply_all_patches.py
          venv\Scripts\python.exe setup\windows\ensure_spotiflow_deps.py
          venv\Scripts\python.exe main.py --smoke-test

      - name: Build portable bundle and zip
        shell: cmd
        run: |
          venv\Scripts\python.exe build\windows\build_windows_bundle.py
          tar -acf dist\BactoMate-win64.zip -C dist\BactoMate .

      - name: Upload Windows zip to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ZIP="dist/BactoMate-win64.zip"
          test -f "$ZIP"
          SIZE=$(stat -c%s "$ZIP")
          echo "Windows zip: $SIZE bytes"
          if [ "$SIZE" -ge "${GITHUB_ASSET_MAX_BYTES}" ]; then
            echo "::error::Windows zip exceeds GitHub's 2 GiB asset limit."
            exit 1
          fi
          gh release upload "${{ github.ref_name }}" "$ZIP" --clobber

  publish-release:
    name: Publish GitHub release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}"
